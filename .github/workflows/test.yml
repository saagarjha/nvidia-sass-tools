name: Test Disassembler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CUDA 12.8 toolkit
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y cuda-toolkit-12-8
          echo "/usr/local/cuda/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Verify CUDA installation
        run: |
          nvcc --version
          nvdisasm --version

      - name: Clone DocumentSASS
        run: git clone https://github.com/0xD0GF00D/DocumentSASS.git

      - name: Dump architecture spec
        run: |
          cd DocumentSASS
          make sm_90_instructions.txt
          cp sm_90_instructions.txt ..

      - name: Generate disassembler
        run: python3 generate_disassembler.py sm_90_instructions.txt sm90_disasm.py

      - name: Run tests
        run: python3 test_disassembler.py sm90_disasm --spec sm_90_instructions.txt
